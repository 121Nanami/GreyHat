<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MIDI Pad</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#12101a;--panel:#1c1828}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;background:linear-gradient(145deg,#0e0c14,#241830 50%,#1a2830);color:#f2e9ff;font-family:'Space Grotesk',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:1rem}
  h1{font-size:clamp(1.6rem,5vw,2.4rem);letter-spacing:-.03em}
  .pads{display:grid;grid-template-columns:repeat(4,minmax(64px,100px));gap:10px}
  .pad{aspect-ratio:1;border:0;border-radius:14px;cursor:pointer;font:700 1rem 'Space Grotesk',sans-serif;color:#0c0a10;
    background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 8px 0 #0006,0 12px 24px #0005;transition:transform .08s,box-shadow .08s}
  .pad:active,.pad.hit{transform:translateY(6px);box-shadow:0 2px 0 #0006,0 4px 12px #0004}
  .hint{opacity:.55;font-size:.85rem}
</style>
</head>
<body>
<h1>MIDI Pad</h1>
<div class="pads" id="pads"></div>
<p class="hint">Click pads or press Z X C V / A S D F · Web Audio synth hits</p>
<script>
let actx;
const notes=[
  {name:'Kick',f:55,type:'sine',c1:'#ff6b4a',c2:'#c23118',key:'z'},
  {name:'Snare',f:180,type:'triangle',c1:'#ffd166',c2:'#e09f3e',key:'x'},
  {name:'Hat',f:800,type:'square',c1:'#06d6a0',c2:'#0a9396',key:'c'},
  {name:'Clap',f:400,type:'sawtooth',c1:'#118ab2',c2:'#073b4c',key:'v'},
  {name:'C3',f:130.81,type:'sine',c1:'#b5179e',c2:'#7209b7',key:'a'},
  {name:'E3',f:164.81,type:'sine',c1:'#f72585',c2:'#b5179e',key:'s'},
  {name:'G3',f:196.00,type:'sine',c1:'#4cc9f0',c2:'#4361ee',key:'d'},
  {name:'C4',f:261.63,type:'triangle',c1:'#80ffdb',c2:'#56cfe1',key:'f'},
];
const root=document.getElementById('pads');
const map={};
notes.forEach((n,i)=>{
  const b=document.createElement('button');
  b.className='pad';b.textContent=n.name;b.style.setProperty('--c1',n.c1);b.style.setProperty('--c2',n.c2);
  b.onpointerdown=()=>hit(n,b);
  root.appendChild(b);map[n.key]=()=>hit(n,b);
});
function ensure(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)()}
function hit(n,el){
  ensure();el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),100);
  const t=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=n.type;o.frequency.setValueAtTime(n.f,t);
  if(n.name==='Kick')o.frequency.exponentialRampToValueAtTime(40,t+0.15);
  g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(0.5,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+(n.name==='Hat'?0.08:0.3));
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.35);
}
addEventListener('keydown',e=>{const fn=map[e.key.toLowerCase()];if(fn){e.preventDefault();fn()}});
</script>
</body></html>
