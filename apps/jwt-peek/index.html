<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>JWT Peek</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Figtree:wght@600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#111318;--ink:#edf0f6;--muted:#9399a8;--panel:#1a1e27;--acc:#f0b429}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-family:'IBM Plex Mono',monospace;padding:1.25rem}
h1{font-family:Figtree,sans-serif;font-size:1.35rem;margin-bottom:.35rem}
.note{color:var(--muted);font-size:.8rem;margin-bottom:1rem}
textarea{width:100%;min-height:110px;background:var(--panel);border:1px solid #2c3342;color:var(--ink);padding:.7rem;border-radius:3px;font:inherit}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:1rem}
pre{background:var(--panel);border:1px solid #2c3342;padding:.75rem;overflow:auto;white-space:pre-wrap;min-height:8rem;font-size:.8rem}
.err{color:#ff7b7b}
h2{font-family:Figtree,sans-serif;font-size:.95rem;color:var(--acc);margin-bottom:.4rem}
</style>
</head>
<body>
<h1>JWT Peek</h1>
<p class="note">Decode only — signature is NOT verified. Paste stays in-page.</p>
<textarea id="t" placeholder="header.payload.signature"></textarea>
<div class="grid">
  <div><h2>Header</h2><pre id="h"></pre></div>
  <div><h2>Payload</h2><pre id="p"></pre></div>
  <div><h2>Meta</h2><pre id="m"></pre></div>
</div>
<script>
function b64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
function run(){
  const raw=$('t').value.trim();const parts=raw.split('.');
  if(parts.length<2){$('h').textContent=$('p').textContent='';$('m').textContent='need at least header.payload';return}
  try{
    const header=JSON.parse(b64url(parts[0]));
    const payload=JSON.parse(b64url(parts[1]));
    $('h').textContent=JSON.stringify(header,null,2);
    $('p').textContent=JSON.stringify(payload,null,2);
    const meta=[];
    if(payload.exp) meta.push('exp: '+new Date(payload.exp*1000).toISOString()+(payload.exp*1000<Date.now()?' (EXPIRED)':''));
    if(payload.iat) meta.push('iat: '+new Date(payload.iat*1000).toISOString());
    if(payload.nbf) meta.push('nbf: '+new Date(payload.nbf*1000).toISOString());
    meta.push('segments: '+parts.length+' (sig '+(parts[2]?'present':'missing')+')');
    meta.push('verify: NOT performed');
    $('m').textContent=meta.join('\\n');
  }catch(e){$('h').innerHTML='<span class="err">'+e.message+'</span>';$('p').textContent=$('m').textContent=''}
}
const $=id=>document.getElementById(id);
$('t').addEventListener('input',run);
</script>
</body>
</html>
