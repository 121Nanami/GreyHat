<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pomodoro Orb</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Karla:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  :root{--ink:#1a1208;--gold:#e8b86d;--ember:#c45c26;}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;font-family:Karla,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#2a1810 0%,#6b3a1e 40%,#c47a3a 70%,#f0d5a8 100%);overflow:hidden}
  .stage{text-align:center;position:relative}
  h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.5rem,8vw,4.5rem);color:#fff8e7;text-shadow:0 8px 30px #0006;margin-bottom:1.5rem;letter-spacing:.04em}
  .orb{width:min(280px,70vw);aspect-ratio:1;border-radius:50%;margin:0 auto 1.5rem;
    background:radial-gradient(circle at 35% 30%,#ffe7b0,#e8b86d 40%,#c45c26 70%,#5a2208);
    box-shadow:0 30px 60px #0005,inset -20px -20px 40px #0004,inset 12px 12px 30px #fff6;
    position:relative;display:grid;place-items:center;transition:filter .4s}
  .orb::after{content:'';position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff8,#fff0 60%);pointer-events:none}
  .orb.break{background:radial-gradient(circle at 35% 30%,#d6f0ff,#7eb8d4 45%,#2a6a8a 75%,#0a2a3a);filter:saturate(1.1)}
  time{font-size:2.8rem;font-weight:600;color:#1a1208;position:relative;z-index:1;font-variant-numeric:tabular-nums}
  .orb.break time{color:#e8f4ff}
  .btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
  button{font:600 .95rem Karla,sans-serif;border:0;padding:.7rem 1.2rem;border-radius:999px;cursor:pointer;
    background:#1a1208;color:#f0d5a8;transition:transform .15s,background .15s}
  button:hover{transform:translateY(-2px);background:#3a2410}
  button.ghost{background:transparent;color:#1a1208;border:2px solid #1a120866}
  .mode{margin-top:1rem;letter-spacing:.2em;text-transform:uppercase;font-size:.75rem;color:#1a1208aa}
</style>
</head>
<body>
<div class="stage">
  <h1>Pomodoro Orb</h1>
  <div class="orb" id="orb"><time id="t">25:00</time></div>
  <div class="btns">
    <button id="start">Start</button>
    <button class="ghost" id="reset">Reset</button>
    <button class="ghost" id="skip">Skip</button>
  </div>
  <p class="mode" id="mode">focus</p>
</div>
<script>
const FOCUS=25*60, BRK=5*60;
let left=FOCUS, mode='focus', running=false, iv;
const orb=document.getElementById('orb'), t=document.getElementById('t'), modeEl=document.getElementById('mode');
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function paint(){t.textContent=fmt(left);orb.classList.toggle('break',mode==='break');modeEl.textContent=mode}
function tick(){if(left<=0){mode=mode==='focus'?'break':'focus';left=mode==='focus'?FOCUS:BRK;new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH2Onp2QgHBsdn+Mk5OQi4mEg4N/f4KGi46OjIuKh4WDf35+gIWJi4uLiYiGg4F/f4CEiImKiomIh4WDgH9+gIOGiImJiYiHhoSCf39+gIOFiImJiYiHhoSCf39+gIOFiImJiYiHhoSCfw==').play().catch(()=>{});}else left--;paint()}
document.getElementById('start').onclick=()=>{running=!running;document.getElementById('start').textContent=running?'Pause':'Start';clearInterval(iv);if(running)iv=setInterval(tick,1000)};
document.getElementById('reset').onclick=()=>{running=false;clearInterval(iv);document.getElementById('start').textContent='Start';left=mode==='focus'?FOCUS:BRK;paint()};
document.getElementById('skip').onclick=()=>{mode=mode==='focus'?'break':'focus';left=mode==='focus'?FOCUS:BRK;paint()};
paint();
</script>
</body></html>
